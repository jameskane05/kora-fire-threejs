<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MLS-MPM goo — raw WebGPU</title>
    <style>
      :root {
        color-scheme: dark;
        --fg: #e8e2d9;
        --dim: #8d8579;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #07070a;
        color: var(--fg);
        font: 13px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
        overflow: hidden;
      }
      #app { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
      #info {
        position: fixed;
        left: 16px;
        bottom: 14px;
        pointer-events: none;
        background: rgba(0, 0, 0, 0.55);
        padding: 6px 10px;
        border-radius: 4px;
      }
      #info .title { font-weight: 600; }
      #hud, #status { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
      #status { white-space: pre-wrap; }
      #xr {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        z-index: 5;
      }
      #xr .hint { flex-basis: 100%; text-align: center; color: var(--dim); font-size: 12px; }
      #xr button {
        padding: 10px 22px;
        border: 1px solid #4a4437;
        border-radius: 999px;
        background: #16151b;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      #xr button:hover:not(:disabled) { background: #241f18; border-color: #7a6a4a; }
      #xr button:disabled { color: var(--dim); cursor: default; opacity: 0.65; }
      #xr button[hidden] { display: none; }
      #xr label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 4px 10px 8px;
        cursor: pointer;
      }
      #xr label[hidden] { display: none; }
    </style>
    <script type="module" crossorigin src="/kora-fire-threejs/assets/modulepreload-polyfill-Dezn_h7o.js"></script>
    <script type="module" crossorigin src="/kora-fire-threejs/assets/lil-gui.esm-BsdZdNnU.js"></script>
    <script type="module" crossorigin src="/kora-fire-threejs/assets/solver-D9IA81Pz.js"></script>
    <script type="module" crossorigin src="/kora-fire-threejs/assets/math-BRI2IDP5.js"></script>
    <script type="module" crossorigin src="/kora-fire-threejs/assets/main-BavrteXF.js"></script>
  </head>
  <body data-app="goo">
    <canvas id="app"></canvas>
    <div id="xr">
      <label id="xr-warp" hidden><input id="xr-warp-input" type="checkbox" />Space Warp</label>
      <button id="xr-vr" hidden>Enter VR</button>
      <button id="xr-ar" hidden>Enter MR</button>
      <div class="hint">Pinch with both hands to move and scale the simulation space</div>
    </div>
    <div id="info">
      <div class="title">MLS-MPM goo · raw WebGPU</div>
      <div id="status">Loading…</div>
      <div id="hud"></div>
    </div>
  </body>
</html>
