<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AVP sandbox — fire / sand / goo / water</title>
    <style>
      :root {
        color-scheme: dark;
        --fg: #e8e2d9;
        --dim: #8d8579;
        --accent: #d4a574;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #07070a;
        color: var(--fg);
        font: 13px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
        overflow: hidden;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }

      #hud {
        position: fixed;
        left: 16px;
        bottom: 14px;
        pointer-events: none;
        text-shadow: 0 1px 3px #000;
      }
      #hud .title { font-weight: 600; }
      #hud .sub { color: var(--dim); font-size: 12px; }
      #stats {
        font-variant-numeric: tabular-nums;
        color: var(--dim);
        font-size: 12px;
        margin-top: 4px;
      }

      #toolbar {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 5;
      }
      .mat-btn, #mat-reset, .nav {
        padding: 8px 14px;
        border: 1px solid #4a4437;
        border-radius: 999px;
        background: #16151b;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      .mat-btn:hover, #mat-reset:hover, .nav:hover { border-color: #7a6a4a; background: #241f18; }
      .mat-btn.active { border-color: var(--accent); color: var(--accent); }

      #xr-button {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        padding: 10px 22px;
        border: 1px solid #4a4437;
        border-radius: 999px;
        background: #16151b;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
        z-index: 5;
      }
      #xr-button:hover:not(:disabled) { background: #241f18; border-color: #7a6a4a; }
      #xr-button:disabled { color: var(--dim); cursor: default; opacity: 0.65; }
      #xr-button[hidden] { display: none; }

      #unsupported {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        padding: 40px;
        background: #07070a;
        z-index: 10;
      }
      #unsupported.show { display: grid; }
      #unsupported div { max-width: 44ch; text-align: center; }
      #unsupported h1 { font-size: 18px; margin: 0 0 10px; }
      #unsupported p { color: var(--dim); margin: 0; }
      a { color: #ffab5e; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="toolbar">
      <button class="mat-btn" id="mat-fire">Fire</button>
      <button class="mat-btn" id="mat-sand">Sand</button>
      <button class="mat-btn" id="mat-goo">Goo</button>
      <button class="mat-btn" id="mat-water">Water</button>
      <button class="mat-btn" id="mat-view" hidden title="Goo surface: gelatin isosurface vs bead impostors">Gel</button>
      <button id="mat-reset">Reset</button>
      <a class="nav" href="./cube.html">Cube</a>
    </div>

    <button id="xr-button" hidden></button>

    <div id="hud">
      <div class="title">AVP sandbox</div>
      <div class="sub">Fire · sand · goo · water · desktop GUI + XR world params</div>
      <div id="stats"></div>
    </div>

    <div id="unsupported">
      <div>
        <h1>WebGPU is not available</h1>
        <p>
          This sandbox runs combustion and MLS-MPM in WebGPU compute shaders. Try Chrome/Edge 113+,
          or Safari 18+ / visionOS with WebGPU.
        </p>
      </div>
    </div>

    <script type="module" src="/src/materials/main.ts"></script>
  </body>
</html>
