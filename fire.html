<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kora-style physics-based fire — three.js / WebGPU</title>
    <style>
      :root {
        color-scheme: dark;
        --fg: #e8e2d9;
        --dim: #8d8579;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #07070a;
        color: var(--fg);
        font: 13px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
        overflow: hidden;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }

      #hud {
        position: fixed;
        left: 16px;
        bottom: 14px;
        pointer-events: none;
        text-shadow: 0 1px 3px #000;
      }
      #hud .title {
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #hud .sub { color: var(--dim); font-size: 12px; }
      #stats {
        font-variant-numeric: tabular-nums;
        color: var(--dim);
        font-size: 12px;
        margin-top: 4px;
      }

      #xr-button {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        padding: 10px 22px;
        border: 1px solid #4a4437;
        border-radius: 999px;
        background: #16151b;
        color: var(--fg);
        font: inherit;
        letter-spacing: 0.02em;
        cursor: pointer;
        z-index: 5;
      }
      #xr-button:hover:not(:disabled) { background: #241f18; border-color: #7a6a4a; }
      #xr-button:disabled { color: var(--dim); cursor: default; opacity: 0.65; }
      #xr-button[hidden] { display: none; }

      #unsupported {
        position: fixed; inset: 0; display: none; place-items: center;
        padding: 40px; background: #07070a; z-index: 10;
      }
      #unsupported.show { display: grid; }
      #unsupported div { max-width: 44ch; text-align: center; }
      #unsupported h1 { font-size: 18px; margin: 0 0 10px; }
      #unsupported p { color: var(--dim); margin: 0; }
      a { color: #ffab5e; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <button id="xr-button" hidden></button>

    <div id="hud">
      <div class="title">Kora — physics-based combustion</div>
      <div class="sub">
        full tooling ·
        <a href="./materials.html">sandbox</a>
      </div>
      <div id="stats"></div>
    </div>

    <div id="unsupported">
      <div>
        <h1>WebGPU is not available</h1>
        <p>
          This demo runs the combustion solver in WebGPU compute shaders. Try Chrome/Edge 113+,
          or Safari 18+ / Safari Technology Preview on macOS.
        </p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
