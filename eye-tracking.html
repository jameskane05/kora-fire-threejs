<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eye tracking — WebGPU VR</title>
    <style>
      :root {
        color-scheme: dark;
        --fg: #e8e2d9;
        --dim: #8d8579;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #07070a;
        color: var(--fg);
        font: 13px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
        overflow: hidden;
      }
      #app { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
      #info {
        position: fixed;
        left: 16px;
        bottom: 14px;
        max-width: min(560px, calc(100% - 32px));
        pointer-events: none;
        background: rgba(0, 0, 0, 0.55);
        padding: 6px 10px;
        border-radius: 4px;
      }
      #info .title { font-weight: 600; }
      #status { color: var(--dim); font-size: 12px; white-space: pre-wrap; font-variant-numeric: tabular-nums; }
      #xr {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 5;
      }
      #xr button {
        padding: 10px 22px;
        border: 1px solid #4a4437;
        border-radius: 999px;
        background: #16151b;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      #xr button:hover:not(:disabled) { background: #241f18; border-color: #7a6a4a; }
      #xr button:disabled { color: var(--dim); cursor: default; opacity: 0.65; }
    </style>
    <script type="module" crossorigin src="/kora-fire-threejs/assets/eye-jCaL35GB.js"></script>
    <link rel="modulepreload" crossorigin href="/kora-fire-threejs/assets/modulepreload-polyfill-Dezn_h7o.js">
    <link rel="modulepreload" crossorigin href="/kora-fire-threejs/assets/math-BRI2IDP5.js">
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="xr">
      <button id="xr-vr" disabled>Enter VR</button>
      <button id="xr-ar" disabled>Enter MR</button>
    </div>
    <div id="info">
      <div class="title">Eye tracking · raw WebGPU</div>
      <div id="status">Loading…</div>
    </div>
  </body>
</html>
